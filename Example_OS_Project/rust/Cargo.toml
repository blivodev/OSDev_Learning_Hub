[package]
name = "example_os_rust"
version = "0.1.0"
edition = "2021"

# --- How to build the Rust kernel --------------------------------------
# The KERNEL itself is freestanding and builds with the stable bare-metal
# target x86_64-unknown-none:
#     rustup target add x86_64-unknown-none
#     cargo build --target x86_64-unknown-none
#
# To turn it into a BOOTABLE disk image (the "make it actually boot" step)
# you need the `bootloader` crate, which requires a NIGHTLY toolchain and
# `cargo bootimage` (or the modern bootloader build-dependency approach).
# See the Makefile and docs/setup.md. Right now we keep the kernel lean and
# depend only on the Rust core library.
[dependencies]

[profile.release]
panic = "abort"   # no unwinding on bare metal

# Where `cargo build` puts artifacts (managed by .cargo/config.toml).
