<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Arial, Helvetica, sans-serif">
  <title>The Boot Chain</title>
  <!-- Boxes left to right -->
  <g font-size="13">
    <rect x="20" y="110" width="120" height="60" fill="#fff3bf" stroke="#f08c00" stroke-width="2" rx="6"/>
    <text x="80" y="136" text-anchor="middle" font-weight="bold" fill="#e8590c">BIOS / UEFI</text>
    <text x="80" y="154" text-anchor="middle" font-size="11" fill="#333">firmware boots</text>

    <rect x="180" y="90" width="130" height="100" fill="#e5dbff" stroke="#7048e8" stroke-width="2" rx="6"/>
    <text x="245" y="118" text-anchor="middle" font-weight="bold" fill="#5f3dc4">Stage 1</text>
    <text x="245" y="137" text-anchor="middle" font-size="11" fill="#333">512-byte MBR</text>
    <text x="245" y="153" text-anchor="middle" font-size="11" fill="#333">loads Stage 2</text>
    <text x="245" y="169" text-anchor="middle" font-size="11" fill="#333">jumps to it</text>

    <rect x="350" y="80" width="140" height="120" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2" rx="6"/>
    <text x="420" y="110" text-anchor="middle" font-weight="bold" fill="#2b8a3e">Stage 2 (GRUB)</text>
    <text x="420" y="130" text-anchor="middle" font-size="11" fill="#333">reads grub.cfg</text>
    <text x="420" y="148" text-anchor="middle" font-size="11" fill="#333">finds kernel.bin</text>
    <text x="420" y="166" text-anchor="middle" font-size="11" fill="#333">checks magic 0x1BADB002</text>
    <text x="420" y="184" text-anchor="middle" font-size="11" fill="#333">loads to 1 MiB</text>

    <rect x="530" y="110" width="90" height="60" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2" rx="6"/>
    <text x="575" y="136" text-anchor="middle" font-weight="bold" fill="#c92a2a">Kernel</text>
    <text x="575" y="154" text-anchor="middle" font-size="11" fill="#333">_start</text>
  </g>

  <!-- Arrows -->
  <g stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="140" y1="140" x2="180" y2="140"/>
    <line x1="310" y1="140" x2="350" y2="140"/>
    <line x1="490" y1="140" x2="530" y2="140"/>
  </g>
  <g font-size="11" fill="#666">
    <text x="160" y="132" text-anchor="middle">0x55AA</text>
    <text x="330" y="132" text-anchor="middle">handoff</text>
    <text x="510" y="132" text-anchor="middle">jump</text>
  </g>

  <!-- Note -->
  <g font-size="12" fill="#444">
    <rect x="20" y="230" width="600" height="20" fill="#f1f3f5" rx="3"/>
    <text x="30" y="243">Bootloader hands over control (plus a memory map in EBX) — but never a stack; the kernel sets its own at _start.</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
