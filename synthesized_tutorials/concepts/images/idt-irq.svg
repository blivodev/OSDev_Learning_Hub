<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="Arial, Helvetica, sans-serif">
  <title>Interrupt Handling: Hardware to ISR via the IDT</title>

  <!-- Hardware -->
  <g font-size="13">
    <rect x="20" y="120" width="120" height="70" fill="#fff3bf" stroke="#f08c00" stroke-width="2" rx="6"/>
    <text x="80" y="148" text-anchor="middle" font-weight="bold" fill="#e8590c">Hardware</text>
    <text x="80" y="167" text-anchor="middle" font-size="11" fill="#333">timer / keyboard</text>
    <text x="80" y="182" text-anchor="middle" font-size="11" fill="#666">raises IRQ</text>
  </g>

  <!-- PIC -->
  <g>
    <rect x="185" y="120" width="110" height="70" fill="#e5dbff" stroke="#7048e8" stroke-width="2" rx="6"/>
    <text x="240" y="148" text-anchor="middle" font-weight="bold" fill="#5f3dc4">PIC / APIC</text>
    <text x="240" y="167" text-anchor="middle" font-size="11" fill="#333">routes IRQ</text>
    <text x="240" y="182" text-anchor="middle" font-size="11" fill="#666">IRQ0 =&gt; int 32</text>
  </g>

  <!-- IDT -->
  <g>
    <rect x="340" y="70" width="130" height="170" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2" rx="6"/>
    <text x="405" y="98" text-anchor="middle" font-weight="bold" fill="#2b8a3e">IDT</text>
    <text x="405" y="118" text-anchor="middle" font-size="11" fill="#333">256 descriptors</text>
    <text x="405" y="140" text-anchor="middle" font-size="11" fill="#666">0-31  CPU exc.</text>
    <text x="405" y="158" text-anchor="middle" font-size="11" fill="#666">32-47 HW IRQs</text>
    <text x="405" y="176" text-anchor="middle" font-size="11" fill="#666">48-255 custom</text>
    <text x="405" y="200" text-anchor="middle" font-size="11" fill="#666">(loaded with lidt)</text>
  </g>

  <!-- ISR -->
  <g>
    <rect x="520" y="120" width="100" height="70" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2" rx="6"/>
    <text x="570" y="148" text-anchor="middle" font-weight="bold" fill="#c92a2a">ISR</text>
    <text x="570" y="167" text-anchor="middle" font-size="11" fill="#333">your handler</text>
    <text x="570" y="182" text-anchor="middle" font-size="11" fill="#666">then iret</text>
  </g>

  <!-- Arrows -->
  <g stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="140" y1="155" x2="185" y2="155"/>
    <line x1="295" y1="155" x2="340" y2="155"/>
    <line x1="470" y1="155" x2="520" y2="155"/>
  </g>
  <g font-size="11" fill="#666">
    <text x="162" y="147" text-anchor="middle">hardware line</text>
    <text x="317" y="147" text-anchor="middle">interrupt #</text>
    <text x="495" y="147" text-anchor="middle">lookup</text>
  </g>

  <!-- bottom note -->
  <g font-size="12" fill="#444">
    <rect x="20" y="270" width="600" height="20" fill="#f1f3f5" rx="3"/>
    <text x="30" y="283">Hardware fires an interrupt; the PIC routes it to an interrupt number; the CPU looks that up in the IDT and jumps to your ISR, which returns via iret.</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
