<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="Arial, Helvetica, sans-serif">
  <title>VGA Text Framebuffer Layout at 0xB8000</title>

  <!-- Memory base -->
  <g font-size="13">
    <text x="20" y="30" font-weight="bold" fill="#0b7285">VGA text memory starts at 0xB8000</text>
    <rect x="20" y="45" width="600" height="180" fill="#e7f5ff" stroke="#0b7285" stroke-width="2" rx="6"/>
  </g>

  <!-- A few cells -->
  <g font-size="12">
    <!-- char cell -->
    <rect x="45" y="60" width="180" height="70" fill="#fff3bf" stroke="#f08c00" stroke-width="2" rx="4"/>
    <text x="135" y="80" text-anchor="middle" font-weight="bold" fill="#e8590c">Cell = 2 bytes</text>
    <text x="135" y="105" text-anchor="middle" font-size="11" fill="#333">char (low byte)</text>
    <text x="135" y="120" text-anchor="middle" font-size="11" fill="#333">color (high byte)</text>
    <!-- memory layout -->
    <rect x="250" y="60" width="360" height="70" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2" rx="4"/>
    <text x="430" y="80" text-anchor="middle" font-weight="bold" fill="#2b8a3e">0xB8000 : 'H' 0x0F |</text>
    <text x="430" y="90" text-anchor="middle" font-weight="bold" fill="#2b8a3e">'e' 0x0F |</text>
    <text x="430" y="100" text-anchor="middle" font-weight="bold" fill="#2b8a3e">'l' 0x0F | ...</text>
    <text x="430" y="122" text-anchor="middle" font-size="11" fill="#666">2000 cells total (80 cols x 25 rows)</text>
  </g>

  <!-- Screen grid representation -->
  <g font-size="11">
    <text x="20" y="260" font-weight="bold" fill="#0b7285">The screen: columns x rows</text>
    <rect x="20" y="270" width="52" height="30" fill="#ffd8a8" stroke="#e8590c" stroke-width="2" rx="3"/>
    <text x="46" y="289" text-anchor="middle">col 0</text>
    <rect x="78" y="270" width="52" height="30" fill="#ffd8a8" stroke="#e8590c" stroke-width="2" rx="3"/>
    <text x="104" y="289" text-anchor="middle">col 1</text>
    <rect x="136" y="270" width="52" height="30" fill="#ffd8a8" stroke="#e8590c" stroke-width="2" rx="3"/>
    <text x="162" y="289" text-anchor="middle">col 2</text>
    <rect x="194" y="270" width="52" height="30" fill="#e9ecef" stroke="#adb5bd" stroke-width="2" rx="3"/>
    <text x="220" y="289" text-anchor="middle">...</text>
    <rect x="252" y="270" width="90" height="30" fill="#ffd8a8" stroke="#e8590c" stroke-width="2" rx="3"/>
    <text x="297" y="289" text-anchor="middle">col 79 (row 0)</text>
    <rect x="348" y="270" width="120" height="30" fill="#e9ecef" stroke="#adb5bd" stroke-width="2" rx="3"/>
    <text x="408" y="289" text-anchor="middle">... 25 rows total</text>
  </g>

  <!-- color byte -->
  <g font-size="11">
    <text x="20" y="325" font-weight="bold" fill="#0b7285">Color byte 0x0F:</text>
    <rect x="130" y="310" width="220" height="16" fill="#dee2e6" stroke="#495057" stroke-width="1.5"/>
    <text x="240" y="321" text-anchor="middle" font-size="10">bits 7-4 = background (0)</text>
    <rect x="356" y="310" width="220" height="16" fill="#ffe3e3" stroke="#c92a2a" stroke-width="1.5"/>
    <text x="466" y="321" text-anchor="middle" font-size="10">bits 3-0 = foreground (0xF = white)</text>
  </g>

  <defs></defs>
</svg>
