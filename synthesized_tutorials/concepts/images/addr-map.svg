<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="Arial, Helvetica, sans-serif">
  <title>Virtual to Physical Address Translation</title>
  <!-- Left: virtual address space -->
  <g font-size="14" fill="#333">
    <text x="20" y="30" font-weight="bold" fill="#0b7285">Virtual address space</text>
    <rect x="20" y="45" width="180" height="300" fill="#e7f5ff" stroke="#0b7285" stroke-width="2" rx="6"/>
    <rect x="35" y="60" width="150" height="70" fill="#fff3bf" stroke="#f08c00" stroke-width="2" rx="4"/>
    <text x="110" y="88" text-anchor="middle" fill="#e8590c" font-weight="bold">High half</text>
    <text x="110" y="106" text-anchor="middle" font-size="12" fill="#333">0xC0000000+</text>
    <text x="110" y="122" text-anchor="middle" font-size="12" fill="#666">(kernel)</text>
    <rect x="35" y="145" width="150" height="170" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2" rx="4"/>
    <text x="110" y="200" text-anchor="middle" fill="#2b8a3e" font-weight="bold">Low half</text>
    <text x="110" y="218" text-anchor="middle" font-size="12" fill="#333">0x00000000+</text>
    <text x="110" y="234" text-anchor="middle" font-size="12" fill="#666">(user processes)</text>
  </g>

  <!-- Middle: page tables -->
  <g>
    <rect x="255" y="150" width="130" height="130" fill="#e5dbff" stroke="#7048e8" stroke-width="2" rx="6"/>
    <text x="320" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#5f3dc4">Page tables</text>
    <text x="320" y="205" text-anchor="middle" font-size="12" fill="#333">(MMU walk)</text>
    <text x="320" y="222" text-anchor="middle" font-size="12" fill="#666">PD =&gt; PT =&gt; frame</text>
  </g>

  <!-- Right: physical address space -->
  <g font-size="14" fill="#333">
    <text x="470" y="130" font-weight="bold" fill="#c92a2a">Physical RAM</text>
    <rect x="470" y="145" width="150" height="180" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2" rx="6"/>
    <rect x="485" y="160" width="120" height="45" fill="#ffc9c9" stroke="#c92a2a" stroke-width="2" rx="3"/>
    <text x="545" y="180" text-anchor="middle" font-size="12" fill="#c92a2a" font-weight="bold">0x100000</text>
    <text x="545" y="196" text-anchor="middle" font-size="12" fill="#333">kernel here</text>
    <rect x="485" y="215" width="120" height="40" fill="#ffa8a8" stroke="#c92a2a" stroke-width="2" rx="3"/>
    <text x="545" y="240" text-anchor="middle" font-size="12" fill="#c92a2a" font-weight="bold">0x000000</text>
    <rect x="485" y="265" width="120" height="45" fill="#ffd8a8" stroke="#e8590c" stroke-width="2" rx="3"/>
    <text x="545" y="285" text-anchor="middle" font-size="12" fill="#e8590c" font-weight="bold">0xB8000</text>
    <text x="545" y="300" text-anchor="middle" font-size="12" fill="#333">VGA buffer</text>
  </g>

  <!-- Arrows -->
  <g stroke="#7048e8" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="200" y1="100" x2="255" y2="190"/>
    <line x1="385" y1="190" x2="470" y2="215"/>
  </g>
  <g stroke="#c92a2a" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="200" y1="230" x2="255" y2="220"/>
  </g>

  <!-- Caption box -->
  <g font-size="12" fill="#444">
    <rect x="20" y="355" width="600" height="18" fill="#f1f3f5" rx="3"/>
    <text x="30" y="368">Virtual addresses (left) are translated by the page tables (middle) into physical frames of RAM (right).</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7048e8"/>
    </marker>
  </defs>
</svg>
